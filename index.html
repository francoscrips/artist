
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate Musician CV & Cover Letter Generator</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; background: #121212; color: #fff; display: flex; height: 100vh; overflow: hidden; }
        
        .sidebar { width: 380px; background: #1a1a1a; padding: 20px; display: flex; flex-direction: column; gap: 15px; overflow-y: auto; border-right: 1px solid #333; flex-shrink: 0; z-index: 10; }
        .sidebar h2 { font-size: 1.1rem; text-transform: uppercase; color: #00fff0; margin-bottom: 5px; letter-spacing: 1px; }
        
        .form-g { display: flex; flex-direction: column; gap: 6px; margin-bottom: 8px; }
        label { font-size: 0.7rem; text-transform: uppercase; color: #aaa; font-weight: 700; letter-spacing: 0.5px; }
        input, textarea, select { width: 100%; padding: 10px; background: #262626; border: 1px solid #444; color: #fff; border-radius: 4px; font-family: inherit; font-size: 0.85rem; transition: opacity 0.2s; }
        input[type="range"] { padding: 0; height: 15px; cursor: pointer; }
        input:focus, textarea:focus, select:focus { outline: none; border-color: #00fff0; }
        input[type="color"] { padding: 0; height: 35px; cursor: pointer; }
        input:disabled { background: #1a1a1a; border-color: #333; color: #666; cursor: not-allowed; }
        input[type="month"]::-webkit-calendar-picker-indicator { filter: invert(1); cursor: pointer; }
        
        .input-group { display: flex; align-items: stretch; }
        .input-group-addon { background: #333; padding: 10px; border: 1px solid #444; border-right: none; border-radius: 4px 0 0 4px; font-size: 0.85rem; display: flex; align-items: center; justify-content: center; font-weight: bold; }
        .input-group input { border-radius: 0 4px 4px 0; }

        .tabs { display: flex; gap: 4px; margin-bottom: 10px; background: #242424; padding: 2px; border-radius: 4px; }
        .tab { flex: 1; padding: 10px; background: none; border: none; color: #aaa; cursor: pointer; font-size: 0.75rem; text-transform: uppercase; font-weight: 700; border-radius: 4px; }
        .tab.active { background: #00fff0; color: #121212; }
        .pane { display: none; } .pane.active { display: block; }
        
        .btn { background: #00fff0; color: #121212; padding: 12px; border: none; font-weight: 700; cursor: pointer; text-transform: uppercase; width: 100%; margin-top: 10px; border-radius: 4px; letter-spacing: 0.5px; }
        .btn-outline { background: transparent; border: 1px dashed #00fff0; color: #00fff0; margin-top: 0; margin-bottom: 15px; }
        .btn-outline:hover { background: rgba(0, 255, 240, 0.1); }

        .dynamic-block-input { border: 1px solid #333; padding: 12px; border-radius: 6px; background: #222; margin-bottom: 12px; }
        .dynamic-block-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .remove-btn { color: #ff4d4d; font-size: 0.7rem; text-transform: uppercase; font-weight: bold; cursor: pointer; }
        
        .preview { flex: 1; background: #2b2b2b; padding: 40px; overflow-y: auto; display: flex; flex-direction: column; align-items: center; }
        #pages-container { display: flex; flex-direction: column; gap: 40px; width: 100%; align-items: center; }
        
        /* A4 Page Styling Engine */
        .paper { 
            --title-color: #222222;
            --body-color: #444444;
            width: 210mm; 
            height: 297mm; 
            background: #f5f5f5; 
            padding: 50px; 
            position: relative; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); 
            display: flex; 
            flex-direction: column; 
            overflow: hidden; 
        }
        
        .header { margin-bottom: 40px; display: flex; justify-content: space-between; align-items: flex-start; }
        .header-text { flex: 1; padding-top: 10px; display: flex; flex-direction: column; align-items: flex-start; }
        .name { font-size: 3.2rem; font-weight: 900; text-transform: uppercase; line-height: 0.95; letter-spacing: -1px; word-break: break-word; color: var(--title-color); }
        .title { font-size: 1.1rem; letter-spacing: 4px; text-transform: uppercase; margin-top: 12px; padding-bottom: 12px; border-bottom: 1px solid #ccc; font-weight: 400; color: var(--title-color); opacity: 0.8; width: 100%; }
        
        .qr-container { display: flex; flex-direction: row; align-items: center; gap: 12px; margin-top: 20px; }
        .qr-code { width: 75px; height: 75px; border-radius: 4px; mix-blend-mode: multiply; }
        .qr-label { font-size: 0.65rem; font-weight: 700; text-transform: uppercase; color: var(--title-color); letter-spacing: 1px; text-align: left; max-width: 120px; line-height: 1.4; opacity: 0.9; }

        .visuals { display: flex; gap: 20px; align-items: flex-end; }
        .profile-pic { width: 160px; height: 210px; border-radius: 8px; object-fit: cover; display: none; box-shadow: 0 6px 15px rgba(0,0,0,0.15); transition: width 0.1s, height 0.1s; }
        
        .grid { display: grid; grid-template-columns: 220px 1fr; gap: 40px; }
        .col-left, .col-right { display: block; }
        
        .section-h { margin-top: 25px; font-size: 1.1rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; border-bottom: 1px solid #ddd; padding-bottom: 5px; margin-bottom: 15px; color: var(--title-color); }
        .col-left > *:first-child, .col-right > *:first-child { margin-top: 0 !important; }
        
        .contact-text { font-size: 0.85rem; line-height: 1.6; word-break: break-all; color: var(--title-color); display: flex; flex-direction: column; }
        .contact-item { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; color: var(--title-color); }
        .contact-icon { width: 16px; height: 16px; color: var(--title-color); flex-shrink: 0; }
        .contact-item a { color: var(--title-color); text-decoration: none; transition: 0.2s; }
        .contact-item a:hover { text-decoration: underline; }
        
        .track-item { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
        .play-btn { width: 24px; height: 24px; background: var(--title-color); color: #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.6rem; flex-shrink: 0; }
        .track-item a { color: var(--title-color); text-decoration: none; }
        .track-item a:hover { text-decoration: underline; }

        .skills-container { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 25px; }
        .skill-pill { padding: 5px 10px; border: 1px solid var(--title-color); border-radius: 4px; font-size: 0.75rem; font-weight: bold; color: var(--title-color); }
        
        .block-item { 
            position: relative;
            margin-bottom: 25px; 
            border-left: 2px solid var(--title-color); 
            padding-left: 15px; 
            padding-top: 15px; 
        }
        .block-item::before, .quote-block::before {
            content: "";
            position: absolute;
            top: 0;
            left: 15px; 
            right: 0;
            height: 1px;
            background: #ddd; 
        }
        .block-h { font-weight: 700; text-transform: uppercase; font-size: 1.1rem; margin-bottom: 2px; letter-spacing: 0.5px; color: var(--title-color); }
        .block-meta { font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; color: var(--body-color); opacity: 0.8; }
        .block-p { font-size: 0.85rem; line-height: 1.6; text-align: justify; color: var(--body-color); }

        .quote-block { 
            position: relative;
            border-left: 3px solid var(--title-color); 
            padding-left: 15px; 
            padding-top: 15px; 
            margin-bottom: 20px; 
            font-style: italic; 
            color: var(--body-color); 
        }
        .quote-text { font-size: 0.9rem; line-height: 1.5; margin-bottom: 5px; }
        .quote-source { font-size: 0.75rem; font-weight: 700; text-transform: uppercase; color: var(--title-color); }

        .cl-meta { font-size: 0.9rem; line-height: 1.6; margin-bottom: 30px; color: var(--body-color); }
        .cl-body { font-size: 0.95rem; line-height: 1.7; text-align: justify; white-space: pre-line; color: var(--body-color); }
        
        @media print { 
            body, .preview { height: auto; overflow: visible; background: none; padding: 0; display: block; }
            .sidebar { display: none !important; } 
            #pages-container { gap: 0; display: block; }
            .paper { box-shadow: none; margin: 0; page-break-after: always; } 
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <h2>Artist CV Engine</h2>
        <div class="tabs">
            <button class="tab active" onclick="setTab(event, 'p-prof')">Profile</button>
            <button class="tab" onclick="setTab(event, 'p-sec')">Content</button>
            <button class="tab" onclick="setTab(event, 'p-style')">Design</button>
        </div>
        
        <div id="p-prof" class="pane active">
            <div class="form-g"><label>Profile Picture</label><input type="file" id="in-pic" accept="image/*" onchange="loadPic(event)" style="padding: 6px;"></div>
            <div class="form-g"><label>Picture Size</label><input type="range" id="in-pic-scale" min="80" max="250" value="160" oninput="upPicScale()"></div>
            <div class="form-g"><label>Artist Name</label><input type="text" id="in-name" value="Jamie Chastain" oninput="up()"></div>
            <div class="form-g"><label>Subtitle</label><input type="text" id="in-title" value="Musician" oninput="up()"></div>
            <div class="form-g"><label>Portfolio / Streaming Link (Generates QR)</label><input type="text" id="in-qr" value="https://spotify.com" placeholder="https://..." oninput="up()"></div>
            
            <hr style="border: none; border-top: 1px solid #333; margin: 15px 0;">
            <label style="color: #00fff0;">Contact Details</label>
            
            <div class="form-g"><label>City</label><input type="text" id="in-city" value="Amsterdam" oninput="up()"></div>
            <div class="form-g"><label>Postal Code</label><input type="text" id="in-postal" value="1011 AB" placeholder="1234 AB" oninput="up()"></div>
            <div class="form-g">
                <label>Phone Number</label>
                <div class="input-group">
                    <span class="input-group-addon">+31</span>
                    <input type="tel" id="in-phone" value="6 1234 5678" oninput="up()">
                </div>
            </div>
            <div class="form-g"><label>Email</label><input type="email" id="in-email" value="hello@reallygreatsite.com" oninput="up()"></div>
            <div class="form-g"><label>Website</label><input type="text" id="in-web" value="www.reallygreatsite.com" oninput="up()"></div>
        </div>

        <div id="p-sec" class="pane">
            <label style="color: #00fff0; margin-bottom: 10px; display: block;">Experience & Projects</label>
            <div id="dynamic-content-list"></div>
            <button type="button" class="btn btn-outline" onclick="addContentBlock('', '', '', '', '')">+ Add New Content</button>
            
            <hr style="border: none; border-top: 1px solid #333; margin: 15px 0;">
            
            <label style="color: #00fff0; margin-bottom: 10px; display: block;">Press & Acclaim</label>
            <div id="dynamic-quotes-list"></div>
            <button type="button" class="btn btn-outline" onclick="addQuoteBlock('', '')">+ Add Press Quote</button>

            <hr style="border: none; border-top: 1px solid #333; margin: 15px 0;">

            <div class="form-g"><label>Tech Skills, DAW & Gear (Comma separated)</label><textarea id="in-skills" rows="3" oninput="up()">Ableton Live 11, Logic Pro, Fender Stratocaster, Moog Sub 37, Live Looping</textarea></div>
            
            <hr style="border: none; border-top: 1px solid #333; margin: 15px 0;">

            <label style="color: #00fff0; margin-bottom: 10px; display: block;">Tracks & Releases</label>
            <div class="form-g" style="margin-bottom: 12px;"><label>Section Title</label><input type="text" id="in-tracks-title" value="Discography" oninput="up()"></div>
            <div id="dynamic-tracks-list"></div>
            <button type="button" class="btn btn-outline" onclick="addTrackBlock('', '', '')">+ Add Track</button>

            <hr style="border: none; border-top: 1px solid #333; margin: 15px 0;">
            
            <div class="form-g"><label>Cover Letter Recipient</label><textarea id="in-cl-meta" rows="2" oninput="up()">October 24, 2026&#10;To the Booking Management Team</textarea></div>
            <div class="form-g"><label>Cover Letter Body</label><textarea id="in-cl-body" rows="6" oninput="up()">Dear Management Team,&#10;&#10;I am writing to express my eager interest in joining your performing artist roster. My signature style balances modern acoustic sensibilities with professional performance metrics.&#10;&#10;Sincerely,&#10;Jamie Chastain</textarea></div>
        </div>

        <div id="p-style" class="pane">
            <div class="form-g"><label>View Presentation</label><select id="in-view" onchange="up()"><option value="cv">Musician CV / Resume Layout</option><option value="cl">Matching Cover Letter Style</option></select></div>
            <div class="form-g"><label>Paper Color</label><input type="color" id="c-paper" value="#f5f5f5" oninput="upStyle()"></div>
            <div class="form-g"><label>Title Color</label><input type="color" id="c-title" value="#222222" oninput="upStyle()"></div>
            <div class="form-g"><label>Body Text Color</label><input type="color" id="c-body" value="#444444" oninput="upStyle()"></div>
        </div>
        
        <button class="btn" onclick="window.print()">Export Document PDF</button>
    </div>

    <!-- Hidden templates for A4 Pagination logic -->
    <div id="templates" style="display: none;">
        <div id="tmp-header">
            <div class="header">
                <div class="header-text">
                    <div class="name" id="tmp-name"></div>
                    <div class="title" id="tmp-title"></div>
                    <div id="tmp-qr-container" class="qr-container" style="display: none;">
                        <img id="tmp-qr" class="qr-code" alt="QR Code">
                        <div class="qr-label">Portfolio / Streaming</div>
                    </div>
                </div>
                <div class="visuals">
                    <img id="tmp-pic" class="profile-pic" alt="Profile">
                </div>
            </div>
        </div>
        <div id="tmp-left"></div>
        <div id="tmp-right"></div>
        <div id="tmp-cl"></div>
    </div>

    <div class="preview">
        <div id="pages-container">
            <!-- Paginated A4 Papers appear here -->
        </div>
    </div>

    <script>
        const iconCity = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="contact-icon"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>`;
        const iconPostal = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="contact-icon"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>`;
        const iconPhone = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="contact-icon"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path></svg>`;
        const iconEmail = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="contact-icon"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>`;
        const iconWeb = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="contact-icon"><circle cx="12" cy="12" r="10"></circle><line x1="2" y1="12" x2="22" y2="12"></line><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path></svg>`;

        function setTab(e, id) {
            document.querySelectorAll('.tab').forEach(function(b) { b.classList.remove('active'); });
            document.querySelectorAll('.pane').forEach(function(p) { p.classList.remove('active'); });
            e.currentTarget.classList.add('active');
            document.getElementById(id).classList.add('active');
        }

        function loadPic(event) {
            var reader = new FileReader();
            reader.onload = function(){
                var output = document.getElementById('tmp-pic');
                output.src = reader.result;
                output.style.display = 'block';
                up();
            };
            if(event.target.files[0]) {
                reader.readAsDataURL(event.target.files[0]);
            }
        }

        function upPicScale() {
            var val = document.getElementById('in-pic-scale').value;
            var pic = document.getElementById('tmp-pic');
            pic.style.width = val + 'px';
            pic.style.height = (val * 1.3125) + 'px';
            up();
        }

        function togglePresent(cb) {
            var block = cb.closest('.dynamic-block-input');
            var endInput = block.querySelector('.dyn-end');
            if (cb.checked) {
                endInput.disabled = true; endInput.style.opacity = '0.4';
            } else {
                endInput.disabled = false; endInput.style.opacity = '1';
            }
            up();
        }

        function addContentBlock(title, body, city, start, end) {
            var list = document.getElementById('dynamic-content-list');
            var div = document.createElement('div');
            div.className = 'dynamic-block-input';
            div.innerHTML = 
                '<div class="dynamic-block-header"><label style="margin: 0;">Experience Section</label><span class="remove-btn" onclick="removeContentBlock(this)">Remove &times;</span></div>' +
                '<div class="form-g" style="margin-bottom: 6px;"><input type="text" class="dyn-title" placeholder="Role / Section Title" value="' + title + '" oninput="up()"></div>' +
                '<div class="form-g" style="margin-bottom: 6px;"><input type="text" class="dyn-city" placeholder="City / Location" value="' + city + '" oninput="up()"></div>' +
                '<div style="display: flex; gap: 6px; margin-bottom: 6px;"><input type="month" class="dyn-start" title="Start Date" value="' + start + '" oninput="up()"><input type="month" class="dyn-end" title="End Date" value="' + end + '" oninput="up()"></div>' +
                '<label style="display: flex; align-items: center; gap: 8px; margin-bottom: 10px; font-size: 0.75rem; color: #ccc; cursor: pointer; text-transform: none; font-weight: normal;">' +
                    '<input type="checkbox" class="dyn-present" onchange="togglePresent(this)" style="width: auto; margin: 0; cursor: pointer;"> I currently work here' +
                '</label>' +
                '<div class="form-g" style="margin-bottom: 0;"><textarea class="dyn-body" rows="4" placeholder="Section Body text..." oninput="up()">' + body + '</textarea></div>';
            list.appendChild(div); up();
        }

        function addQuoteBlock(quote, source) {
            var list = document.getElementById('dynamic-quotes-list');
            var div = document.createElement('div');
            div.className = 'dynamic-block-input';
            div.innerHTML = 
                '<div class="dynamic-block-header"><label style="margin: 0;">Press Quote</label><span class="remove-btn" onclick="removeContentBlock(this)">Remove &times;</span></div>' +
                '<div class="form-g" style="margin-bottom: 6px;"><textarea class="dyn-quote-text" rows="3" placeholder="&quot;An absolute masterclass in live acoustic looping.&quot;" oninput="up()">' + quote + '</textarea></div>' +
                '<div class="form-g" style="margin-bottom: 0;"><input type="text" class="dyn-quote-source" placeholder="Source (e.g. Rolling Stone)" value="' + source + '" oninput="up()"></div>';
            list.appendChild(div); up();
        }

        function addTrackBlock(name, info, link) {
            var list = document.getElementById('dynamic-tracks-list');
            var div = document.createElement('div');
            div.className = 'dynamic-block-input';
            div.innerHTML = 
                '<div class="dynamic-block-header"><label style="margin: 0;">Track / Release</label><span class="remove-btn" onclick="removeContentBlock(this)">Remove &times;</span></div>' +
                '<div class="form-g" style="margin-bottom: 6px;"><input type="text" class="dyn-track-name" placeholder="Track Name" value="' + name + '" oninput="up()"></div>' +
                '<div class="form-g" style="margin-bottom: 6px;"><input type="text" class="dyn-track-info" placeholder="Album / Description (Optional)" value="' + info + '" oninput="up()"></div>' +
                '<div class="form-g" style="margin-bottom: 0;"><input type="text" class="dyn-track-link" placeholder="Link URL (Optional)" value="' + link + '" oninput="up()"></div>';
            list.appendChild(div); up();
        }

        function removeContentBlock(btn) { btn.parentElement.parentElement.remove(); up(); }

        function upStyle() {
            var papers = document.querySelectorAll('.paper');
            var bg = document.getElementById('c-paper').value;
            var tc = document.getElementById('c-title').value;
            var bc = document.getElementById('c-body').value;
            papers.forEach(function(p) {
                p.style.background = bg;
                p.style.setProperty('--title-color', tc);
                p.style.setProperty('--body-color', bc);
            });
        }

        function buildContactItem(icon, text, href) {
            if (!text || !text.trim()) return '';
            var innerContent = href ? '<a href="' + href + '" target="_blank">' + text + '</a>' : text;
            return '<div class="contact-item">' + icon + '<span>' + innerContent + '</span></div>';
        }

        function formatMonthYear(val) {
            if(!val) return '';
            var match = val.match(/^(\d{4})-(\d{2})$/);
            if(match) {
                var months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
                return months[parseInt(match[2], 10) - 1] + ' ' + match[1];
            }
            return val;
        }

        function paginate() {
            var container = document.getElementById('pages-container');
            container.innerHTML = '';
            var pages = [];
            var view = document.getElementById('in-view').value;

            function getPage(index) {
                while(pages.length <= index) {
                    var paper = document.createElement('div');
                    paper.className = 'paper';
                    
                    var cInner = document.createElement('div');
                    paper.appendChild(cInner);

                    if (pages.length === 0) {
                        var headerClone = document.getElementById('tmp-header').cloneNode(true);
                        headerClone.id = '';
                        headerClone.children[0].style.display = 'flex';
                        cInner.appendChild(headerClone.children[0]);
                    } else {
                        var spacer = document.createElement('div');
                        spacer.style.height = '15px';
                        cInner.appendChild(spacer);
                    }

                    if (view === 'cv') {
                        var grid = document.createElement('div');
                        grid.className = 'grid';
                        var colLeft = document.createElement('div'); colLeft.className = 'col-left';
                        var colRight = document.createElement('div'); colRight.className = 'col-right';
                        grid.appendChild(colLeft); grid.appendChild(colRight);
                        cInner.appendChild(grid);
                        
                        container.appendChild(paper);
                        pages.push({ paper: paper, colLeft: colLeft, colRight: colRight });
                    } else {
                        var clWrap = document.createElement('div');
                        cInner.appendChild(clWrap);
                        
                        container.appendChild(paper);
                        pages.push({ paper: paper, clWrap: clWrap });
                    }
                }
                return pages[index];
            }

            if (view === 'cv') {
                var leftItems = Array.from(document.getElementById('tmp-left').children);
                var pLeft = 0;
                leftItems.forEach(function(item) {
                    var clone = item.cloneNode(true);
                    getPage(pLeft).colLeft.appendChild(clone);
                    if (getPage(pLeft).paper.scrollHeight > getPage(pLeft).paper.clientHeight) {
                        if (getPage(pLeft).colLeft.children.length > 1) {
                            getPage(pLeft).colLeft.removeChild(clone);
                            pLeft++;
                            getPage(pLeft).colLeft.appendChild(clone);
                        }
                    }
                });

                var rightItems = Array.from(document.getElementById('tmp-right').children);
                var pRight = 0;
                rightItems.forEach(function(item) {
                    var clone = item.cloneNode(true);
                    getPage(pRight).colRight.appendChild(clone);
                    if (getPage(pRight).paper.scrollHeight > getPage(pRight).paper.clientHeight) {
                        if (getPage(pRight).colRight.children.length > 1) {
                            getPage(pRight).colRight.removeChild(clone);
                            pRight++;
                            getPage(pRight).colRight.appendChild(clone);
                        }
                    }
                });
            } else {
                var clItems = Array.from(document.getElementById('tmp-cl').children);
                var pIndex = 0;
                clItems.forEach(function(item) {
                    var clone = item.cloneNode(true);
                    getPage(pIndex).clWrap.appendChild(clone);
                });
            }
            upStyle();
        }

        function up() {
            document.getElementById('tmp-name').innerText = document.getElementById('in-name').value.toUpperCase();
            document.getElementById('tmp-title').innerText = document.getElementById('in-title').value.toUpperCase();
            
            var qrUrl = document.getElementById('in-qr').value.trim();
            var qrImg = document.getElementById('tmp-qr');
            var qrContainer = document.getElementById('tmp-qr-container');
            if (qrUrl) {
                qrImg.src = 'https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=' + encodeURIComponent(qrUrl);
                qrContainer.style.display = 'flex';
            } else {
                qrContainer.style.display = 'none';
            }

            var tmpLeft = document.getElementById('tmp-left');
            tmpLeft.innerHTML = '';
            
            var contactH = document.createElement('div');
            contactH.className = 'section-h'; contactH.innerText = 'Contact';
            tmpLeft.appendChild(contactH);
            
            var city = document.getElementById('in-city').value;
            var postal = document.getElementById('in-postal').value.toUpperCase();
            var phone = document.getElementById('in-phone').value;
            var email = document.getElementById('in-email').value.trim();
            var web = document.getElementById('in-web').value.trim();

            var contacts = [];
            contacts.push(buildContactItem(iconCity, city, null));
            contacts.push(buildContactItem(iconPostal, postal, null));
            contacts.push(buildContactItem(iconPhone, phone ? '+31 ' + phone : '', null));
            contacts.push(buildContactItem(iconEmail, email, email ? 'mailto:' + email : null));
            contacts.push(buildContactItem(iconWeb, web, web ? (web.startsWith('http') ? web : 'https://' + web) : null));
            
            contacts.forEach(function(cHtml) {
                if (cHtml) {
                    var div = document.createElement('div'); div.innerHTML = cHtml;
                    tmpLeft.appendChild(div.firstChild);
                }
            });

            var skillsRaw = document.getElementById('in-skills').value.split(',');
            var validSkills = skillsRaw.filter(s => s.trim() !== '');
            if(validSkills.length > 0) {
                var skillH = document.createElement('div');
                skillH.className = 'section-h'; skillH.innerText = 'Tech & Gear';
                tmpLeft.appendChild(skillH);
                
                var skillWrap = document.createElement('div');
                skillWrap.className = 'skills-container';
                validSkills.forEach(function(skill) {
                    skillWrap.innerHTML += '<div class="skill-pill">' + skill.trim() + '</div>';
                });
                tmpLeft.appendChild(skillWrap);
            }

            var tTitle = document.getElementById('in-tracks-title').value.trim();
            if(tTitle) {
                var trH = document.createElement('div');
                trH.className = 'section-h'; trH.innerText = tTitle;
                tmpLeft.appendChild(trH);
            }
            
            var tBlocks = document.querySelectorAll('#dynamic-tracks-list .dynamic-block-input');
            for(var k=0; k < tBlocks.length; k++) {
                var tName = tBlocks[k].querySelector('.dyn-track-name').value.trim();
                var tInfo = tBlocks[k].querySelector('.dyn-track-info').value.trim();
                var tLink = tBlocks[k].querySelector('.dyn-track-link').value.trim();
                
                if(tName || tInfo) {
                    var titleHtml = tLink ? '<a href="' + (tLink.startsWith('http') ? tLink : 'https://' + tLink) + '" target="_blank">' + tName + '</a>' : tName;
                    var tHtml = '<div class="track-item"><div class="play-btn">&#9654;</div><div><div style="font-weight:700; font-size:0.85rem; color:var(--title-color);">' + titleHtml + '</div>';
                    if(tInfo) tHtml += '<div style="font-size:0.75rem; opacity:0.8; margin-top:2px; color:var(--body-color);">' + tInfo + '</div>';
                    tHtml += '</div></div>';
                    
                    var wrap = document.createElement('div'); wrap.innerHTML = tHtml;
                    tmpLeft.appendChild(wrap.firstChild);
                }
            }

            var tmpRight = document.getElementById('tmp-right');
            tmpRight.innerHTML = '';
            
            var blocks = document.querySelectorAll('#dynamic-content-list .dynamic-block-input');
            for (var i = 0; i < blocks.length; i++) {
                var bTitle = blocks[i].querySelector('.dyn-title').value.trim();
                var bCity = blocks[i].querySelector('.dyn-city').value.trim();
                var bStart = formatMonthYear(blocks[i].querySelector('.dyn-start').value.trim());
                var bEnd = formatMonthYear(blocks[i].querySelector('.dyn-end').value.trim());
                var isPresent = blocks[i].querySelector('.dyn-present').checked;
                var bBody = blocks[i].querySelector('.dyn-body').value.trim();
                
                if (isPresent) bEnd = 'Present';

                var metaParts = [];
                if (bCity) metaParts.push(bCity);
                var dateStr = '';
                if (bStart && bEnd) dateStr = bStart + ' – ' + bEnd;
                else if (bStart && isPresent) dateStr = bStart + ' – Present';
                else if (bStart) dateStr = bStart;
                else if (bEnd) dateStr = bEnd;
                else if (isPresent) dateStr = 'Present';
                if (dateStr) metaParts.push(dateStr);
                
                var metaText = metaParts.join(' | ');
                
                if (bTitle || bBody || metaText) {
                    var html = '<div class="block-item">';
                    if (bTitle) html += '<div class="block-h">' + bTitle + '</div>';
                    if (metaText) html += '<div class="block-meta">' + metaText + '</div>';
                    if (bBody) html += '<div class="block-p">' + bBody.replace(/\n/g, '<br>') + '</div>';
                    html += '</div>';
                    var div = document.createElement('div'); div.innerHTML = html;
                    tmpRight.appendChild(div.firstChild);
                }
            }

            var quoteBlocks = document.querySelectorAll('#dynamic-quotes-list .dynamic-block-input');
            if(quoteBlocks.length > 0) {
                var qH = document.createElement('div');
                qH.className = 'section-h'; qH.innerText = 'Press Quotes';
                tmpRight.appendChild(qH);
            }
            for (var j = 0; j < quoteBlocks.length; j++) {
                var qText = quoteBlocks[j].querySelector('.dyn-quote-text').value.trim();
                var qSource = quoteBlocks[j].querySelector('.dyn-quote-source').value.trim();
                if (qText || qSource) {
                    var qHtml = '<div class="quote-block">';
                    if (qText) qHtml += '<div class="quote-text">"' + qText + '"</div>';
                    if (qSource) qHtml += '<div class="quote-source">— ' + qSource + '</div>';
                    qHtml += '</div>';
                    var qDiv = document.createElement('div'); qDiv.innerHTML = qHtml;
                    tmpRight.appendChild(qDiv.firstChild);
                }
            }

            var tmpCl = document.getElementById('tmp-cl');
            tmpCl.innerHTML = '<div style="margin-top: 15px;" class="cl-meta">' + document.getElementById('in-cl-meta').value.replace(/\n/g, '<br>') + '</div>' + 
                              '<div class="cl-body">' + document.getElementById('in-cl-body').value.replace(/\n/g, '<br>') + '</div>';

            paginate();
        }

        window.onload = function() { 
            addContentBlock('Lead Guitarist & Arranger', 'Performed across multiple European venues as part of the summer acoustic tour. Collaborated on setlist curation and stage arrangements.', 'Amsterdam', '2021-05', '');
            
            var firstBlockCb = document.querySelector('.dyn-present');
            if(firstBlockCb) { firstBlockCb.checked = true; togglePresent(firstBlockCb); }

            addContentBlock('Studio Musician', 'Provided backing tracks and compositional ideas for independent film scores. Worked closely with sound engineers to achieve desired acoustic textures.', 'London', '2018-02', '2020-11');
            addContentBlock('Session Artist', 'Featured on over 15 indie releases providing rhythmic acoustic beds.', 'Berlin', '2016-01', '2018-01');
            
            addQuoteBlock('Jamie Chastain brings a rare, raw energy to the acoustic stage that is utterly impossible to ignore.', 'The Indie Music Blog');

            addTrackBlock('Midnight Echoes', 'The Fall EP', 'https://spotify.com');
            addTrackBlock('Acoustic Session', 'Live Mix', '');
            addTrackBlock('Neon Skies', 'Single', '');

            upPicScale(); up(); 
        };
    </script>
</body>
</html>
